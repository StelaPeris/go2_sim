name: cf_go2
root: ./
startup_window: crazyflies_start
pre_window: |
  source <%= @settings["setup_name"] %>
  source /root/ros2_ws/install/setup.bash
  source /opt/ros/humble/setup.bash
windows:
  - crazyflies_start:
      layout: tiled
      panes:
        - bash ~/ros2_ws/src/mrs_crazyflies/launch/sitl_multiagent_text.sh -m crazyflie -f $SPAWN_POSE_DOC -w $ENV_NAME
        - waitForCfsGazebo;sleep 2; ros2 launch mrs_crazyflies cf_velmux_launch.py
        - waitForCfsGazebo;ros2 launch mrs_crazyflies map_server_launch.py map_yaml:=/root/ros2_ws/src/mrs_crazyflies/maps/$ENV_NAME/$ENV_NAME.yaml
        - history -s "ros2 run teleop_twist_keyboard teleop_twist_keyboard --ros-args --remap cmd_vel:=/cf_1/cmd_vel"
        - waitForCfsGazebo; ros2 launch foxglove_bridge foxglove_bridge_launch.xml port:=8765
  - go2:
      layout: tiled
      panes:
        - waitForCfsGazebo; sleep 3; ros2 launch go2_sim spawn_go2.launch.py x:=0.0 y:=-1.0
        - history -s "ros2 run teleop_twist_keyboard teleop_twist_keyboard --ros-args --remap cmd_vel:=/go2/cmd_vel"
        - history -s "ros2 topic echo /go2/odom --field pose.pose.position"
